[package]
name = "em"
version = "0.0.0"
edition = "2021"
description = "Rust binding of the em C runtime: stackful fibers, thread-per-core, io_uring/epoll"
publish = false
build = "build.rs"

[dependencies]
libc = "0.2"

[build-dependencies]
cc = "1"

# Only for tests/tls.rs: rustls runs on em::TcpStream unchanged, the crate has no TLS code.
[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
