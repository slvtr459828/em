name: ci
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends liburing-dev libssl-dev
      - name: env
        # t3 runs 100k fibers = 200k VMAs; the Ubuntu default (65530) caps em at ~32k
        run: |
          uname -r
          ulimit -l
          cat /proc/sys/vm/max_map_count
          sudo sysctl -w vm.max_map_count=1048576
          sysctl kernel.io_uring_disabled 2>/dev/null || true
      - name: openssl present (the TLS tests must run in CI, not be skipped)
        run: pkg-config --exists openssl
      - run: make test
      - run: make test-asan
      # cargo/rustup come preinstalled on GitHub runners (x86_64 and arm64)
      - run: make test-rust
      # clang with the libFuzzer runtime and curl are on the runner images; install only if a probe fails
      - name: clang (libFuzzer) and curl
        run: |
          probe() { echo 'int LLVMFuzzerTestOneInput(const unsigned char *d, unsigned long n) { return 0; }' |
                    clang -x c -fsanitize=fuzzer,address,undefined - -o /dev/null 2>/dev/null; }
          if ! command -v curl >/dev/null || ! command -v clang >/dev/null || ! probe; then
            sudo apt-get install -y --no-install-recommends clang curl
            probe || sudo apt-get install -y --no-install-recommends "libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev"
            probe
          fi
      - name: fuzz http (60 s, ASan + UBSan)
        run: make fuzz-http FUZZ_SECONDS=60
      - name: curl smoke
        run: tests/http_curl.sh

  # em_tls against AWS-LC (make TLS_PREFIX): the AWS-LC data path in src/tls.c is only built and
  # tested here. The cache is shared with bench.yml (same key) and keeps the ~147 MB build to once.
  awslc:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends liburing-dev libssl-dev cmake golang-go
      - name: env
        run: sudo sysctl -w vm.max_map_count=1048576
      - uses: actions/cache@v4
        with:
          path: build/*/tlslibs
          key: tlslibs-${{ runner.arch }}-${{ hashFiles('bench/tls_libs.sh') }}
      - name: build AWS-LC
        run: BUILD_ONLY=1 LIBS=aws-lc-5.12.0 bench/tls_libs.sh
      - run: make test TLS_PREFIX=$PWD/build/$(uname -m)/tlslibs/aws-lc-5.12.0
      # ASan on em_tls and the tests; AWS-LC itself is not instrumented
      - run: make test-asan TLS_PREFIX=$PWD/build/$(uname -m)/tlslibs/aws-lc-5.12.0

  # D8: the default Docker seccomp profile blocks io_uring. Run the suite the way
  # a container user would: no --privileged, no --security-opt. auto must pick epoll.
  docker-epoll:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: env
        # not namespaced: the container sees the host value (t3 needs it, see above)
        run: sudo sysctl -w vm.max_map_count=1048576
      - name: make test in a default-seccomp container
        run: |
          docker run --rm -e EM_BACKEND=auto -v "$PWD":/src -w /src ubuntu:24.04 bash -ec '
            apt-get update
            apt-get install -y --no-install-recommends gcc make libc6-dev liburing-dev libssl-dev pkg-config
            pkg-config --exists openssl
            make test BACKENDS=auto'
