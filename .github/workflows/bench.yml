name: bench
on:
  workflow_dispatch:
    inputs:
      duration:
        description: seconds per run
        default: "10"
      rounds:
        description: interleaved rounds (median and min-max of per-round ratios are reported)
        default: "5"
      soak:
        description: seconds of bench/soak.sh (em RSS under connection churn) instead of the bench; 0 = off
        default: "0"
      profile:
        description: run bench/profile.sh (syscalls per round-trip + perf profile) instead of the bench
        type: boolean
        default: false
      tlsab:
        description: run bench/tls_ab.sh (em_tls vs tokio-rustls under each ticket mode, and Nagle) instead of the bench
        type: boolean
        default: false
      tlslib:
        description: "run bench/tls_libs.sh: TLS library microbench"
        type: boolean
        default: false
      awslc:
        description: "build em_tls against AWS-LC 5.12.0 (TLS_PREFIX) for the selected script (bench, tlsab, profile)"
        type: boolean
        default: false

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    # (10 servers x 7 cells + 3 TLS servers x 4 cells) x rounds x (duration + ~1 s) = ~65 min at the defaults
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends liburing-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bench/rust
      - name: tlslib deps
        if: inputs.tlslib || inputs.awslc
        run: command -v cmake >/dev/null && command -v go >/dev/null || sudo apt-get install -y --no-install-recommends cmake golang-go
      - uses: actions/cache@v4
        if: inputs.tlslib || inputs.awslc
        with:
          path: build/*/tlslibs
          key: tlslibs-${{ runner.arch }}-${{ hashFiles('bench/tls_libs.sh') }}
      - name: bench
        # max_map_count: em maps stacks per fiber. nofile/memlock (glommio) are raised on this
        # shell, which bench/run.sh inherits; prlimit under sudo may exceed the hard limit.
        run: |
          sudo sysctl -w vm.max_map_count=1048576
          sudo prlimit --pid $$ --nofile=1048576:1048576 --memlock=unlimited:unlimited
          if [[ "${{ inputs.awslc }}" == true ]]; then
            # run.sh, tls_ab.sh and profile.sh build em_tls_echo against this prefix (see bench/run.sh)
            BUILD_ONLY=1 LIBS=aws-lc-5.12.0 bench/tls_libs.sh
            export TLS_PREFIX=$PWD/build/$(uname -m)/tlslibs/aws-lc-5.12.0
          fi
          if [[ "${{ inputs.profile }}" == true ]]; then
            # perf for the runner's kernel; tracepoints and kernel symbols need these sysctls
            sudo apt-get install -y --no-install-recommends linux-tools-common "linux-tools-$(uname -r)" ||
              sudo apt-get install -y --no-install-recommends linux-tools-common linux-tools-azure
            sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
            perf --version
            # libcrypto/libssl symbols (else the profile is hex addresses): debuginfod for perf, and the
            # -dbgsym package from ddebs as a fallback. Neither may fail the run.
            export DEBUGINFOD_URLS=https://debuginfod.ubuntu.com
            {
              sudo apt-get install -y --no-install-recommends ubuntu-dbgsym-keyring &&
              echo "deb [signed-by=/usr/share/keyrings/ubuntu-dbgsym-keyring.gpg] http://ddebs.ubuntu.com $(lsb_release -cs) main restricted universe multiverse" |
                sudo tee /etc/apt/sources.list.d/ddebs.list >/dev/null &&
              sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl3t64-dbgsym
            } || echo "note: libssl3t64-dbgsym not installed; libcrypto symbols rely on debuginfod"
            # tracefs stays root-only, so perf runs under sudo; the servers and client do not
            PERF="sudo perf" DURATION=${{ inputs.duration }} bench/profile.sh
            # TLS echo: em_tls on both backends vs tokio-rustls (own OUT: same cell names as above never clash)
            # churn cells, call graphs (who calls ERR_clear_error, malloc, ...) and PMU counters (skipped on VMs)
            PERF="sudo env DEBUGINFOD_URLS=$DEBUGINFOD_URLS perf" DURATION=${{ inputs.duration }} OUT=bench/out/profile-tls \
              PROF_SERVERS="em-tls-uring em-tls-epoll tokio-rustls" \
              PROF_CELLS="tls:256:128 tls:256:4096 churntls:64:128 churntlsres:64:128" \
              PROF_CALLGRAPH=1 PROF_COUNTERS=1 bench/profile.sh
          elif [[ "${{ inputs.tlsab }}" == true ]]; then
            DURATION=${{ inputs.duration }} ROUNDS=${{ inputs.rounds }} bench/tls_ab.sh
          elif [[ "${{ inputs.tlslib }}" == true ]]; then
            bench/tls_libs.sh
          elif [[ "${{ inputs.soak }}" != 0 ]]; then
            SOAK=${{ inputs.soak }} bench/soak.sh
          else
            DURATION=${{ inputs.duration }} ROUNDS=${{ inputs.rounds }} bench/run.sh
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.os }}
          path: bench/out/
