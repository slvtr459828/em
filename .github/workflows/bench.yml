name: bench
on:
  workflow_dispatch:
    inputs:
      duration:
        description: seconds per run
        default: "10"
      rounds:
        description: interleaved rounds (median and min-max of per-round ratios are reported)
        default: "5"
      soak:
        description: seconds of bench/soak.sh (em RSS under connection churn) instead of the bench; 0 = off
        default: "0"
      profile:
        description: run bench/profile.sh (syscalls per round-trip + perf profile) instead of the bench
        type: boolean
        default: false
      tlsab:
        description: run bench/tls_ab.sh (em_tls vs tokio-rustls under each ticket mode, and Nagle) instead of the bench
        type: boolean
        default: false
      tlslib:
        description: "run bench/tls_libs.sh: TLS library microbench"
        type: boolean
        default: false
      tlsonly:
        description: "bench: only the TLS cells and the TLS memory table (ONLY=tls); use rounds >= 9 for the lost-cells verdicts"
        type: boolean
        default: false
      httponly:
        description: "bench: only the HTTP cells, plain and TLS (ONLY=http, plans/http.md): em-http-* vs nginx, haproxy, h2o, hyper, Go net/http; not with tlsonly; rivals does not apply; use rounds >= 9 for the verdicts"
        type: boolean
        default: false
      httpab:
        description: "base git ref (e.g. 160066d): run bench/http_ab.sh (em_http at that ref vs this checkout, plain HTTP cells, same job) instead of the bench; empty = off"
        default: ""
      rivals:
        description: "bench only: rust = the Rust runtimes (default); cpp = em + tokio + C/C++/Go servers (plans/bench-cpp.md); all = both"
        type: choice
        options: [rust, cpp, all]
        default: rust
      awslc:
        description: "build em_tls against AWS-LC 5.12.0 (TLS_PREFIX) for the selected script (bench, tlsab, profile)"
        type: boolean
        default: false

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    # rust: (10 servers x 7 cells + 9 TLS servers x 4 cells) x rounds x (duration + ~1 s) = ~97 min at the defaults;
    # tlsonly: 9 x 4 x 9 rounds x ~11 s = ~59 min + build + bench/rss_tls.sh (~5 min). Raise the timeout if a
    # tlsonly run exceeds 75 min; do not cut the rounds.
    # cpp: 11 plain servers x 7 cells + 12 TLS servers x 4 cells - 1 (go-tls-epoll has no churntlsres) = 124 runs per
    #   round x 5 rounds x 11 s = ~114 min at the defaults; tlsonly 47 x 9 x 11 s = ~78 min + rss_tls (~8 min).
    # all: 18 x 7 + 17 x 4 - 1 = 193 runs per round x 5 x 11 s = ~177 min; tlsonly 67 x 9 x 11 s = ~111 min + rss_tls (~10 min).
    # httponly: (7 servers x 8 plain cells + 7 TLS servers x 3 TLS cells) x 9 rounds x ~11.5 s = ~133 min + build (Rust
    # client and hyper ~10 min, em_http, h2o from source ~5 min cold: its build is cached, the Go toolchain download is
    # cached too) = ~148 min: over the 150 of the default rivals with no margin, so httponly has its own 200. Keep rivals=rust with it.
    # httpab: 8 cells x 2 backends x 2 versions x 9 rounds x ~11 s = ~53 min + two em_http builds and the client (~12 min
    # cold): inside the default 150.
    # The native servers add a cold build of ~30 min (photon and its pinned liburing/libaio, asio, libuv, go download,
    # seastar ~3.5 min; a warm cpp-deps cache takes about 5), the Rust build ~10. cpp/all budget 300 min: all at the
    # defaults ~220 min, all tlsonly 9 rounds ~160 min. all with 9 rounds and the plain cells is ~355 min: use tlsonly there.
    timeout-minutes: ${{ inputs.httponly && 200 || inputs.rivals == 'rust' && 150 || 300 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.httpab != '' && 0 || 1 }} # httpab: bench/http_ab.sh checks out the base ref as a worktree
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends liburing-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bench/rust
      - name: rivals deps
        if: inputs.rivals != 'rust'
        # the union of the build.sh comments (photon, asio, libuv, go, seastar)
        run: |
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config git python3 ragel \
            curl ca-certificates tar gzip zlib1g-dev libboost-all-dev libc-ares-dev libfmt-dev libgnutls28-dev libhwloc-dev \
            liblz4-dev libnuma-dev libpciaccess-dev libsctp-dev libyaml-cpp-dev libxml2-dev systemtap-sdt-dev \
            libprotobuf-dev protobuf-compiler valgrind xfslibs-dev
      - uses: actions/cache@v4
        if: inputs.rivals != 'rust'
        with:
          # seastar's sources and build tree (GBs, ~3.5 min to rebuild) stay out: its install prefix is enough
          path: |
            build/*/cpp-deps
            !build/*/cpp-deps/seastar-src
            !build/*/cpp-deps/seastar-build
            !build/*/cpp-deps/seastar-echo-build
          key: cpp-deps-${{ runner.arch }}-${{ hashFiles('bench/cpp/*/build.sh', 'bench/go/build.sh') }}
      - name: http deps
        if: inputs.httponly
        # nginx and haproxy (apt: linked against OpenSSL, TLS included) are launched by bench/http/*.sh, so the packaged
        # services stay off; build-essential..zlib1g-dev build h2o (libssl-dev, above, gives it TLS); openssl is the CLI
        # bench/http/cert.sh makes the nginx/haproxy/h2o certificate with; curl..gzip fetch the Go toolchain
        # (bench/go/build.sh); Rust for the client and hyper is installed above
        run: |
          sudo apt-get install -y --no-install-recommends nginx haproxy build-essential cmake git pkg-config zlib1g-dev \
            openssl curl ca-certificates tar gzip
          sudo systemctl disable --now nginx haproxy || true
      - uses: actions/cache@v4
        if: inputs.httponly
        with:
          path: |
            build/*/http-deps
            build/*/cpp-deps/go-*
          key: http-deps-${{ runner.arch }}-${{ hashFiles('bench/http/h2o/build.sh', 'bench/go/build.sh') }}
      - name: tlslib deps
        if: inputs.tlslib || inputs.awslc
        run: command -v cmake >/dev/null && command -v go >/dev/null || sudo apt-get install -y --no-install-recommends cmake golang-go
      - uses: actions/cache@v4
        if: inputs.tlslib || inputs.awslc
        with:
          path: build/*/tlslibs
          key: tlslibs-${{ runner.arch }}-${{ hashFiles('bench/tls_libs.sh') }}
      - name: bench
        # max_map_count: em maps stacks per fiber. nofile/memlock (glommio) are raised on this
        # shell, which bench/run.sh inherits; prlimit under sudo may exceed the hard limit.
        run: |
          sudo sysctl -w vm.max_map_count=1048576
          sudo prlimit --pid $$ --nofile=1048576:1048576 --memlock=unlimited:unlimited
          if [[ "${{ inputs.awslc }}" == true ]]; then
            # run.sh, tls_ab.sh and profile.sh build em_tls_echo against this prefix (see bench/run.sh)
            BUILD_ONLY=1 LIBS=aws-lc-5.12.0 bench/tls_libs.sh
            export TLS_PREFIX=$PWD/build/$(uname -m)/tlslibs/aws-lc-5.12.0
          fi
          if [[ "${{ inputs.profile }}" == true ]]; then
            # perf for the runner's kernel; tracepoints and kernel symbols need these sysctls
            sudo apt-get install -y --no-install-recommends linux-tools-common "linux-tools-$(uname -r)" ||
              sudo apt-get install -y --no-install-recommends linux-tools-common linux-tools-azure
            sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
            perf --version
            # libcrypto/libssl symbols (else the profile is hex addresses): debuginfod for perf, and the
            # -dbgsym package from ddebs as a fallback. Neither may fail the run.
            export DEBUGINFOD_URLS=https://debuginfod.ubuntu.com
            {
              sudo apt-get install -y --no-install-recommends ubuntu-dbgsym-keyring &&
              echo "deb [signed-by=/usr/share/keyrings/ubuntu-dbgsym-keyring.gpg] http://ddebs.ubuntu.com $(lsb_release -cs) main restricted universe multiverse" |
                sudo tee /etc/apt/sources.list.d/ddebs.list >/dev/null &&
              sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl3t64-dbgsym
            } || echo "note: libssl3t64-dbgsym not installed; libcrypto symbols rely on debuginfod"
            # tracefs stays root-only, so perf runs under sudo; the servers and client do not
            PERF="sudo perf" DURATION=${{ inputs.duration }} bench/profile.sh
            # TLS echo: em_tls on both backends vs every TLS server of run.sh (own OUT: same cell names as above never clash)
            # churn cells, call graphs (who calls ERR_clear_error, malloc, ...) and PMU counters (skipped on VMs)
            PERF="sudo env DEBUGINFOD_URLS=$DEBUGINFOD_URLS perf" DURATION=${{ inputs.duration }} OUT=bench/out/profile-tls \
              PROF_SERVERS="$(bash -c 'source bench/run.sh && echo "${TLS_SERVERS[*]}"' bench/profile.sh)" \
              PROF_CELLS="tls:256:128 tls:256:4096 churntls:64:128 churntlsres:64:128" \
              PROF_CALLGRAPH=1 PROF_COUNTERS=1 bench/profile.sh
          elif [[ -n "${{ inputs.httpab }}" ]]; then
            BASE=${{ inputs.httpab }} DURATION=${{ inputs.duration }} ROUNDS=${{ inputs.rounds }} bench/http_ab.sh
          elif [[ "${{ inputs.tlsab }}" == true ]]; then
            DURATION=${{ inputs.duration }} ROUNDS=${{ inputs.rounds }} bench/tls_ab.sh
          elif [[ "${{ inputs.tlslib }}" == true ]]; then
            bench/tls_libs.sh
          elif [[ "${{ inputs.soak }}" != 0 ]]; then
            SOAK=${{ inputs.soak }} bench/soak.sh
          else
            [[ "${{ inputs.tlsonly }}" != true || "${{ inputs.httponly }}" != true ]] || { echo "tlsonly and httponly are exclusive" >&2; exit 2; }
            [[ "${{ inputs.tlsonly }}" != true ]] || export ONLY=tls
            [[ "${{ inputs.httponly }}" != true ]] || export ONLY=http
            export RIVALS=${{ inputs.rivals }}
            DURATION=${{ inputs.duration }} ROUNDS=${{ inputs.rounds }} bench/run.sh
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.os }}
          path: bench/out/
