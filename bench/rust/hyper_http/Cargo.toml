[package]
name = "hyper_http"
version = "0.0.0"
edition = "2021"

# HTTP/1 only (no "http2" feature). TLS: tokio-rustls with the shared tls_cfg, like tokio_rustls_echo.
[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tokio = { version = "1.54", features = ["rt", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tls_cfg = { path = "../tls_cfg" }
